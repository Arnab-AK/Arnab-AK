name: Update Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/overview.svg
          base: "header, repositories, metadata"
          config_theme: dark

      - name: Top languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/languages.svg
          base: ""
          config_theme: dark
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/achievements.svg
          base: ""
          config_theme: dark
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/calendar.svg
          base: ""
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
